<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Cada template puede modificar el título
        mediante el bloque title.
    -->
    <title>
        {% block title %}
        LDJSystem
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light text-dark">

    <!--
        Barra de navegación global.
        Aparece en todas las páginas que extienden base.html.
    -->
    {% include "components/navbar.html" %}


    <!-- ==================================================
         MODALES GLOBALES
         Estos modales pueden abrirse desde cualquier página.
    =================================================== -->

    <!-- Modal de inicio de sesión -->
    {% include "usuarios/login.html" %}

    <!-- Modal de registro de clientes -->
    {% include "usuarios/cliente/agregar_cliente.html" %}


    <!-- ==================================================
         SISTEMA DE NOTIFICACIONES (Sin scripts personalizados)
    =================================================== -->
    <div class="container mt-3">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <strong>¡Éxito!</strong> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
    </div>


    <!-- ==================================================
         CONTENIDO PRINCIPAL
    =================================================== -->
    <main class="container my-4">

        {% block content %}

        {% endblock %}

    </main>


    <!-- Footer global -->
    {% include "components/footer.html" %}

    <!-- Librería nativa de Bootstrap (permite cerrar las alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
