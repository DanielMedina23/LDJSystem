{% extends 'base.html' %}

{% block title %}Eliminar mesa{% endblock %}

{% block content %}
<h1>Eliminar mesa</h1>

<p>¿Estás seguro de que deseas eliminar esta mesa?</p>

<ul>
    <li><strong>ID:</strong> {{ mesa.id }}</li>
    <li><strong>Número:</strong> {{ mesa.numero }}</li>
    <li><strong>Capacidad:</strong> {{ mesa.capacidad }}</li>
</ul>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'ver_mesas' %}">Cancelar</a>
</form>
{% endblock %}
