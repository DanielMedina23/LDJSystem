{% extends 'base.html' %}

{% block title %}Mesas{% endblock %}

{% block content %}
<h1>Listado de mesas</h1>

<a href="{% url 'crear_mesa' %}">Crear nueva mesa</a>

<table>
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Acciones</th>
    </tr>

    {% for mesa in mesas %}
    <tr>
        <td>{{ mesa.id }}</td>
        <td>{{ mesa.numero }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>
            <a href="{% url 'editar_mesa' mesa.id %}">Editar</a>
            <a href="{% url 'eliminar_mesa' mesa.id %}">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
