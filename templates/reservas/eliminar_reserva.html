{% extends "base.html" %}

{% block title %}Eliminar Reserva - LJDSYSTEM{% endblock %}

{% block content %}
<div class="alert alert-danger my-3" role="alert">
    <h4 class="alert-heading">Confirmar Eliminación</h4>
    <p>¿Estás seguro de que deseas eliminar la reserva <strong>#{{ reserva.id }}</strong>?</p>
    <hr>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'ver_reservas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
