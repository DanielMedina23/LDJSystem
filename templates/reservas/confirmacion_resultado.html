{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            {% if exito %}
                <div class="card border-success shadow-sm p-4 text-center">
                    <div class="card-body">
                        <i class="bi bi-check-circle-fill text-success display-1"></i>
                        <h2 class="card-title mt-3">¡Reserva Confirmada!</h2>
                        <p class="card-text text-muted mt-2">{{ mensaje }}</p>
                        <a href="{% url 'plano:ver_plano' %}" class="btn btn-primary mt-3">Ir al plano del local</a>
                    </div>
                </div>
            {% else %}
                <div class="card border-danger shadow-sm p-4 text-center">
                    <div class="card-body">
                        <i class="bi bi-x-circle-fill text-danger display-1"></i>
                        <h2 class="card-title mt-3">Enlace no válido</h2>
                        <p class="card-text text-muted mt-2">{{ mensaje }}</p>
                        <a href="{% url 'plano:ver_plano' %}" class="btn btn-secondary mt-3">Volver al plano</a>
                    </div>
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
