{% extends "base.html" %}

{% block title %}
Eliminar trabajador
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    
                    <h2 class="mb-3 fw-bold text-danger">Eliminar trabajador</h2>
                    <p class="text-muted mb-4">¿Estás seguro de que deseas eliminar a <strong>{{ trabajador.username }}</strong>?</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{% url 'ver_trabajadores' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-danger px-4">Sí, eliminar</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
